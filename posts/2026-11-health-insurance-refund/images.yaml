  - id: photo-02
    file: photo-02.png
    type: photo-ai
    size: 1600x1067
    text: []
    prompt: >
      사진처럼 보이는 실사풍 이미지. 한국 가정의 나무 식탁 위. 60대 초반 부모의 손이 휴대폰을 쥐고 있고,
      30대 자녀의 손가락이 화면을 가리킨다. 식탁 위에 글자가 보이지 않는 흰 우편 봉투 한 장과 안경, 머그잔.
      손과 휴대폰 중심, 얼굴은 보이지 않게. 화면 속 글자는 흐리게. 기관 로고·글자 넣지 말 것.
    alt: 식탁에서 자녀가 부모님 휴대폰 화면을 가리키며 돕는 모습
    caption: 인증 버튼은 부모님이 직접 누르시게 도와드리세요
