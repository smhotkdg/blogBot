# 그림 요청서 — 건강보험 환급금 조회·신청
# 공통 스타일: docs/image-guide.md
# type: thumbnail/illustration/infographic → GPT
#       capture → 사람이 직접 캡처 (guide 참고, mask 항목은 반드시 가리기)
#       photo   → Pexels 후보 (Actions가 내려받음, pick으로 선택)

post: 2026-11-health-insurance-refund
images:
  # ── GPT 그림 ──
  - id: "01"
    file: 01.png
    type: thumbnail
    size: 1080x1080
    text:
      - "건강보험 환급금"
      - "5분이면 확인"
    prompt: >
      대표 이미지. 가운데 큰 굵은 제목 "건강보험 환급금", 그 아래 주황색으로 "5분이면 확인".
      제목 아래에 일반적인 스마트폰 한 대, 화면에서 동전과 지폐가 살짝 튀어나오는 단순한 그림,
      옆에 작은 방패 모양 체크 표시. 공단 로고나 실제 앱 화면은 넣지 말 것.
      밝은 베이지 배경, 주황 포인트, 좌우 여백 같게.
    alt: 건강보험 환급금을 휴대폰으로 확인하는 방법 대표 이미지
    caption: ""

  - id: "02"
    file: 02.png
    type: infographic
    size: 1600x1200
    text:
      - "돌려받는 돈 2가지"
      - "보험료 환급금"
      - "더 낸 보험료"
      - "병원비 초과금"
      - "상한액 넘은 병원비"
    prompt: >
      정리 도표. 위에 제목 "돌려받는 돈 2가지". 아래에 좌우 두 칸 카드.
      왼쪽 카드: 영수증과 되돌아가는 화살표 아이콘, 큰 글씨 "보험료 환급금", 작은 글씨 "더 낸 보험료".
      오른쪽 카드: 병원 건물(십자 표시 없이 단순한 건물)과 계량컵이 넘치는 아이콘, 큰 글씨 "병원비 초과금",
      작은 글씨 "상한액 넘은 병원비". 두 카드 모두 흰 바탕, 주황 테두리.
    alt: 건강보험에서 돌려받는 돈은 더 낸 보험료와 상한액을 넘은 병원비 두 가지라는 도표
    caption: 내 경우가 어디에 해당하는지 먼저 떠올려 보세요

  - id: "03"
    file: 03.png
    type: illustration
    size: 1600x1200
    text:
      - "진짜 안내"
      - "링크 없음"
      - "가짜 문자"
      - "링크 있음"
      - "누르지 마세요"
    prompt: >
      두 칸 비교 그림. 왼쪽 위 이름표 "진짜 안내"(남색), 오른쪽 위 이름표 "가짜 문자"(주황).
      두 칸 모두 휴대폰 문자 말풍선 모양. 말풍선 안 글자는 회색 막대로만 흐리게 표현(실제 문장 쓰지 말 것).
      왼쪽 말풍선 아래 초록 체크와 "링크 없음".
      오른쪽 말풍선 안에는 파란 밑줄 링크 모양 막대 하나를 두고, 아래 빨간 X와 "링크 있음", 그 아래 크게 "누르지 마세요".
      실제 인터넷 주소, 실제 기관 이름·로고는 넣지 말 것.
    alt: 공단 진짜 안내 문자에는 링크가 없고 가짜 문자에는 링크가 있다는 비교 그림
    caption: 링크가 있는 환급금 문자는 누르지 마세요

  - id: "04"
    file: 04.png
    type: infographic
    size: 1600x1200
    text:
      - "환급금 신청 3단계"
      - "앱 설치"
      - "건강보험25시"
      - "'환급금' 검색"
      - "계좌 입력"
      - "신청 끝"
    prompt: >
      정리 도표. 위에 제목 "환급금 신청 3단계". 아래에 왼쪽에서 오른쪽으로 동그라미 번호 ①②③과 화살표로 이어진 세 칸.
      ① 휴대폰과 아래쪽 화살표(설치) 아이콘, 큰 글씨 "앱 설치", 작은 글씨 "건강보험25시".
      ② 돋보기 아이콘, 큰 글씨 "'환급금' 검색".
      ③ 통장(글자 없는 단순한 통장 모양) 아이콘, 큰 글씨 "계좌 입력", 그 아래 주황 체크와 "신청 끝".
      실제 앱 화면·공단 로고를 그리지 말 것. 아이콘은 단순하고 크게.
    alt: 앱 설치, 환급금 검색, 계좌 입력 순서로 이어지는 환급금 신청 3단계 도표
    caption: 이 세 단계만 기억하시면 됩니다

