# 그림 요청서 — 갤럭시 글자 크기 글
# 공통 스타일: docs/image-guide.md
# text: 그림 안에 들어갈 글자(이것만, 철자 그대로)

post: 2026-11-galaxy-text-size
images:
  - id: "01"
    file: 01.png
    type: thumbnail
    size: 1080x1080
    text:
      - "갤럭시 글씨 크게"
      - "3분이면 끝"
    prompt: >
      대표 이미지. 화면 가운데에 큰 굵은 제목 "갤럭시 글씨 크게", 그 아래 작게 주황색 "3분이면 끝".
      제목 아래에 일반적인 스마트폰 하나, 화면 속 글자가 작은 글씨에서 큰 글씨로 커지는 모습을
      돋보기와 함께 단순하게 표현. 밝은 베이지 배경, 주황 포인트. 좌우 여백 같게.
    alt: 갤럭시 휴대폰 글씨를 크게 바꾸는 방법 대표 이미지
    caption: ""

  - id: "02"
    file: 02.png
    type: illustration
    size: 1600x1200
    text:
      - "글자 크기"
      - "글씨만 커져요"
      - "화면 크게/작게"
      - "전부 커져요"
    prompt: >
      두 칸 비교 그림. 왼쪽 칸 이름표 "글자 크기", 오른쪽 칸 이름표 "화면 크게/작게".
      두 칸 모두 같은 휴대폰 화면(아이콘 4개 + 글자 몇 줄)을 보여 준다.
      왼쪽은 아이콘 크기는 그대로이고 글자만 크게. 아래 설명 "글씨만 커져요".
      오른쪽은 아이콘·버튼·글자가 모두 함께 크게. 아래 설명 "전부 커져요".
      차이가 한눈에 보이게, 커진 부분에 주황색 강조.
    alt: 글자 크기는 글씨만, 화면 크게/작게는 아이콘과 버튼까지 커지는 차이를 비교한 그림
    caption: 글자 크기는 글씨만, 화면 크게/작게는 전부 커집니다

  - id: "03"
    file: 03.png
    type: screen-guide
    size: 1080x1920
    text:
      - "디스플레이"
      - "글자 크기와 스타일"
      - "화면 크게/작게"
      - "①"
      - "②"
    prompt: >
      단순화한 휴대폰 설정 화면 두 장을 나란히(왼쪽, 오른쪽). 진짜 캡처처럼 꾸미지 말 것.
      왼쪽: 설정 목록. 여러 줄은 회색 막대로 흐리게, 그중 한 줄만 "디스플레이" 글자, 주황 테두리 + 주황 동그라미 ①.
      오른쪽: 디스플레이 화면 목록. 회색 막대들 사이에 "글자 크기와 스타일"(주황 테두리 + ②)과
      "화면 크게/작게"(테두리 없이 일반 글자) 두 줄.
      왼쪽에서 오른쪽으로 가는 주황 화살표.
    alt: 설정에서 디스플레이를 누르고 글자 크기와 스타일을 누르는 순서
    caption: 설정 → 디스플레이 → 글자 크기와 스타일

  - id: "04"
    file: 04.png
    type: screen-guide
    size: 1080x1920
    text:
      - "글자 크기"
      - "굵은 글꼴"
      - "③"
      - "④"
    prompt: >
      단순화한 "글자 크기와 스타일" 설정 화면 한 장. 위쪽 절반은 예시 글자가 크게 보이는 미리보기 칸.
      아래쪽에 "굵은 글꼴" 글자와 켜진 스위치(주황 테두리 + ④).
      맨 아래에 "글자 크기" 이름표와 가로 막대(점 여러 개 + 동그란 손잡이), 손잡이 옆에 오른쪽 방향 주황 화살표와
      주황 동그라미 ③. 손가락 그림이 손잡이를 오른쪽으로 미는 모습.
    alt: 글자 크기 막대를 오른쪽으로 밀고 굵은 글꼴 스위치를 켜는 화면
    caption: 막대를 오른쪽으로 밀고, 흐릿하면 굵은 글꼴을 켜세요

  - id: "05"
    file: 05.png
    type: screen-guide
    size: 1080x1920
    text:
      - "화면 크게/작게"
      - "①"
    prompt: >
      단순화한 "화면 크게/작게" 설정 화면 한 장. 위쪽 제목 "화면 크게/작게".
      가운데 큰 미리보기 칸에 아이콘과 글자가 있는 작은 화면 예시.
      맨 아래 가로 막대(점 5개 + 동그란 손잡이), 손잡이 옆 오른쪽 주황 화살표와 주황 동그라미 ①.
      손가락이 손잡이를 오른쪽으로 미는 모습.
    alt: 화면 크게/작게 막대를 오른쪽으로 한 칸 미는 화면
    caption: 한 칸씩 밀면서 편한 크기를 찾으세요

  - id: "06"
    file: 06.png
    type: infographic
    size: 1600x1200
    text:
      - "나에게 맞는 방법"
      - "글씨가 작다"
      - "글자 크기"
      - "버튼도 작다"
      - "화면 크게/작게"
      - "글씨가 흐리다"
      - "굵은 글꼴"
    prompt: >
      정리 도표. 위에 제목 "나에게 맞는 방법". 아래로 세 줄, 각 줄은 왼쪽 상황 → 오른쪽 해결.
      1줄: 작은 글씨 아이콘 + "글씨가 작다" → 주황 상자 "글자 크기"
      2줄: 손가락이 작은 버튼을 누르는 아이콘 + "버튼도 작다" → 주황 상자 "화면 크게/작게"
      3줄: 흐릿한 글씨 아이콘 + "글씨가 흐리다" → 주황 상자 "굵은 글꼴"
      화살표는 남색. 단순하고 큰 아이콘.
    alt: 글씨가 작으면 글자 크기, 버튼도 작으면 화면 크게/작게, 흐리면 굵은 글꼴을 고르라는 정리 도표
    caption: ""

